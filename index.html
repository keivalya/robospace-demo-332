<!DOCTYPE html>
<html lang="en">

<head>
    <title>RoboSpace Demo</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="application-name" content="robospace_demo">
    <meta name="description" content="RoboSpace Demo">
    <meta name="keywords" content="RoboSpace">
    <meta name="author" content="keivalya">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no, shrink-to-fit=0">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/x-icon" href="./examples/favicon.png">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <!-- <script src="./dist/mujoco_wasm.js"></script> -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1 hidden></h1>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/",
                "@codemirror/state": "https://esm.sh/@codemirror/state@6",
                "@codemirror/view": "https://esm.sh/@codemirror/view@6",
                "@codemirror/language": "https://esm.sh/@codemirror/language@6",
                "@codemirror/commands": "https://esm.sh/@codemirror/commands@6",
                "@codemirror/lang-python": "https://esm.sh/@codemirror/lang-python@6",
                "@codemirror/theme-one-dark": "https://esm.sh/@codemirror/theme-one-dark@6"
            }
        }
    </script>

    <!-- Toolbar -->
    <div id="toolbar">
        <div class="toolbar-brand">RoboSpace</div>

        <button id="toolbar-menu-toggle" class="toolbar-menu-btn" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <div id="toolbar-collapsible">
            <div class="toolbar-section">
                <label class="toolbar-label">Scene</label>
                <select id="scene-selector" class="toolbar-select"></select>
            </div>

            <div class="toolbar-section">
                <button id="pause-button" class="toolbar-button" title="Pause/Play">⏸</button>
                <button id="reset-button" class="toolbar-button" title="Reset Robot">↺ Robot</button>
                <button id="reload-button" class="toolbar-button" title="Reload Environment">↺ Env</button>
                <button id="plot-toggle-button" class="toolbar-button" title="Toggle live joint plot">📈 Plot</button>
            </div>

        </div>
    </div>

    <script>
        document.getElementById('toolbar-menu-toggle').addEventListener('click', function () {
            const col = document.getElementById('toolbar-collapsible');
            const expanded = col.classList.toggle('open');
            this.setAttribute('aria-expanded', expanded);
        });
    </script>

    <!-- Keyboard Shortcut Help Overlay -->
    <div id="help-overlay" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" style="display:none">
        <div id="help-box">
            <div id="help-header">
                <span>Keyboard Shortcuts</span>
                <button id="help-close" aria-label="Close">✕</button>
            </div>
            <table id="help-table">
                <tbody>
                    <tr><td><kbd>?</kbd></td><td>Toggle this help</td></tr>
                    <tr><td><kbd>Space</kbd></td><td>Pause / Resume simulation</td></tr>
                    <tr><td><kbd>R</kbd></td><td>Reset robot</td></tr>
                    <tr><td><kbd>E</kbd></td><td>Reload environment</td></tr>
                    <tr><td><kbd>Ctrl</kbd>+<kbd>Enter</kbd></td><td>Run Python script</td></tr>
                    <tr><td><kbd>Esc</kbd></td><td>Stop running script</td></tr>
                    <tr><td><kbd>Mouse drag</kbd></td><td>Orbit camera</td></tr>
                    <tr><td><kbd>Scroll</kbd></td><td>Zoom camera</td></tr>
                    <tr><td><kbd>Right-drag</kbd></td><td>Pan camera</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        (function () {
            const overlay = document.getElementById('help-overlay');
            const close = document.getElementById('help-close');

            function toggleHelp() {
                const visible = overlay.style.display !== 'none';
                overlay.style.display = visible ? 'none' : 'flex';
            }

            close.addEventListener('click', toggleHelp);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) toggleHelp(); });

            document.addEventListener('keydown', (e) => {
                // Don't fire shortcuts when typing in the Python editor
                if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
                if (document.getElementById('python-ide')?.contains(e.target)) return;
                if (e.key === '?') { e.preventDefault(); toggleHelp(); }
            });
        })();
    </script>

    <!-- Error Log Panel -->
    <div id="error-panel" style="display:none">
        <div id="error-panel-header">
            <span>Errors</span>
            <button id="error-panel-clear" title="Clear errors">✕ Clear</button>
        </div>
        <div id="error-log"></div>
    </div>
    <script>
        document.getElementById('error-panel-clear').addEventListener('click', () => {
            document.getElementById('error-log').innerHTML = '';
            document.getElementById('error-panel').style.display = 'none';
        });
    </script>

    <!-- Main 3D View -->
    <div id="appbody">
        <script type="module" src="./examples/main.js?v=4"></script>
    </div>

    <!-- Python IDE -->
    <div id="python-ide">
        <div id="ide-resize-handle" title="Drag to resize"></div>
        <div class="ide-header">
            <div class="ide-title">
                <span>Simulation Controller</span>
            </div>
            <div class="ide-controls">
                <button id="run-python" class="ide-button">▶ RUN</button>
                <button id="clear-python" class="ide-button clear">✕</button>
            </div>
        </div>
        <div id="python-editor-container">
            <div id="python-code-editor"></div>
            <!-- Hidden textarea kept as fallback value carrier for non-CM paths -->
            <textarea id="python-code" style="display:none"></textarea>
            <div id="python-output">
                <div class="output-label">OUTPUT</div>
            </div>
        </div>
    </div>

    <!-- IDE resize handle — placed after all elements so getElementById works -->
    <script>
        (function () {
            const STORAGE_KEY = 'robospace_ide_height';
            const MIN_H    = 40;
            const MAX_H    = window.innerHeight * 0.75;
            const DEFAULT_H = 250;

            const ide     = document.getElementById('python-ide');
            const handle  = document.getElementById('ide-resize-handle');
            const appbody = document.getElementById('appbody');

            const saved = parseInt(localStorage.getItem(STORAGE_KEY), 10);
            const initH = (!isNaN(saved) && saved >= MIN_H) ? saved : DEFAULT_H;
            ide.style.height = initH + 'px';
            if (appbody) appbody.style.bottom = initH + 'px';

            let startY = null, startH = null;

            handle.addEventListener('pointerdown', (e) => {
                startY = e.clientY;
                startH = ide.offsetHeight;
                handle.setPointerCapture(e.pointerId);
                document.body.style.cursor = 'ns-resize';
                e.preventDefault();
            });

            handle.addEventListener('pointermove', (e) => {
                if (startY === null) return;
                const delta = startY - e.clientY;   // drag up → taller
                const newH  = Math.min(MAX_H, Math.max(MIN_H, startH + delta));
                ide.style.height = newH + 'px';
                if (appbody) appbody.style.bottom = newH + 'px';
                if (window._roboDemo) window._roboDemo.onWindowResize();
            });

            handle.addEventListener('pointerup', (e) => {
                if (startY === null) return;
                startY = null;
                document.body.style.cursor = '';
                const finalH = ide.offsetHeight;
                localStorage.setItem(STORAGE_KEY, finalH);
                handle.releasePointerCapture(e.pointerId);
            });
        })();
    </script>
</body>

</html>
