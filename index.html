<!DOCTYPE html>
<html lang="en">

<head>
    <title>RoboSpace Demo</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="application-name" content="robospace_demo">
    <meta name="description" content="RoboSpace Demo">
    <meta name="keywords" content="RoboSpace">
    <meta name="author" content="keivalya">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no, shrink-to-fit=0">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/png" href="./examples/favicon.png">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <script src="https://unpkg.com/blockly/blockly.min.js"></script>
    <script src="https://unpkg.com/blockly/python_compressed.js"></script>
    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1 hidden></h1>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/",
                "@codemirror/state": "https://unpkg.com/@codemirror/state@6.4.1/dist/index.js",
                "@codemirror/view": "https://unpkg.com/@codemirror/view@6.34.1/dist/index.js",
                "@codemirror/language": "https://unpkg.com/@codemirror/language@6.10.8/dist/index.js",
                "@codemirror/commands": "https://unpkg.com/@codemirror/commands@6.8.0/dist/index.js",
                "@codemirror/lang-python": "https://unpkg.com/@codemirror/lang-python@6.2.1/dist/index.js",
                "@codemirror/theme-one-dark": "https://unpkg.com/@codemirror/theme-one-dark@6.1.2/dist/index.js",
                "@codemirror/autocomplete": "https://unpkg.com/@codemirror/autocomplete@6.18.3/dist/index.js",
                "style-mod": "https://unpkg.com/style-mod@4.1.2/src/style-mod.js",
                "w3c-keyname": "https://unpkg.com/w3c-keyname@2.2.4/index.es.js",
                "crelt": "https://unpkg.com/crelt@1.0.6/index.js",
                "@lezer/common": "https://unpkg.com/@lezer/common@1.2.3/dist/index.js",
                "@lezer/lr": "https://unpkg.com/@lezer/lr@1.4.2/dist/index.js",
                "@lezer/python": "https://unpkg.com/@lezer/python@1.1.14/dist/index.js",
                "@lezer/highlight": "https://unpkg.com/@lezer/highlight@1.2.1/dist/index.js"
            }
        }
    </script>

    <!-- Top bar -->
    <div id="toolbar">
        <div class="toolbar-section toolbar-section-scene">
            <label class="toolbar-label">Scene</label>
            <select id="scene-selector" class="toolbar-select"></select>
            <button type="button" id="upload-robot-btn" class="toolbar-btn" title="Upload custom robot scene">
                <span class="toolbar-btn-icon">📁</span><span class="toolbar-btn-label">Upload Robot</span>
            </button>
        </div>
        <div class="toolbar-spacer"></div>
        <div id="sim-status" class="sim-status loading" role="status" aria-live="polite">
            <span class="sim-status-dot"></span>
            <span class="sim-status-label">Simulation Loading…</span>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="toolbar-section toolbar-section-program">
            <button type="button" id="ide-import-btn" class="ide-icon-btn" title="Import script from file" aria-label="Import script">📄</button>
            <button type="button" id="ide-menu-btn" class="ide-icon-btn" title="More options" aria-label="More options" aria-haspopup="true" aria-expanded="false">⋯</button>
            <div id="ide-menu-dropdown" class="ide-dropdown" hidden role="menu">
                <div class="ide-dropdown-section" data-section="examples">
                    <div class="ide-dropdown-section-label">Examples</div>
                    <div id="ide-examples-list"></div>
                </div>
                <div class="ide-dropdown-divider"></div>
                <button class="ide-dropdown-item" data-action="reset-code" role="menuitem">Reset code to default</button>
                <button class="ide-dropdown-item" data-action="reload-env" role="menuitem">↺ Reload Env</button>
            </div>
            <input type="file" id="ide-import-file" accept=".py,text/x-python" style="display:none" />
        </div>
    </div>

    <!-- Keyboard Shortcut Help Overlay -->
    <div id="help-overlay" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts" style="display:none">
        <div id="help-box">
            <div id="help-header">
                <span>Keyboard Shortcuts</span>
                <button id="help-close" aria-label="Close">✕</button>
            </div>
            <table id="help-table">
                <tbody>
                    <tr><td><kbd>?</kbd></td><td>Toggle this help</td></tr>
                    <tr><td><kbd>Space</kbd></td><td>Pause / Resume simulation</td></tr>
                    <tr><td><kbd>R</kbd></td><td>Reset robot</td></tr>
                    <tr><td><kbd>E</kbd></td><td>Reload environment</td></tr>
                    <tr><td><kbd>Ctrl</kbd>+<kbd>Enter</kbd></td><td>Run Python script</td></tr>
                    <tr><td><kbd>Esc</kbd></td><td>Stop running script</td></tr>
                    <tr><td><kbd>Mouse drag</kbd></td><td>Orbit camera</td></tr>
                    <tr><td><kbd>Scroll</kbd></td><td>Zoom camera</td></tr>
                    <tr><td><kbd>Right-drag</kbd></td><td>Pan camera</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        (function () {
            const overlay = document.getElementById('help-overlay');
            const close = document.getElementById('help-close');

            function toggleHelp() {
                const visible = overlay.style.display !== 'none';
                overlay.style.display = visible ? 'none' : 'flex';
            }

            close.addEventListener('click', toggleHelp);
            overlay.addEventListener('click', (e) => { if (e.target === overlay) toggleHelp(); });

            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
                if (document.getElementById('python-ide')?.contains(e.target)) return;
                if (e.key === '?') { e.preventDefault(); toggleHelp(); }
            });
        })();
    </script>

    <!-- Error Log Panel -->
    <div id="error-panel" style="display:none">
        <div id="error-panel-header">
            <span>Errors</span>
            <button id="error-panel-clear" title="Clear errors">✕ Clear</button>
        </div>
        <div id="error-log"></div>
    </div>
    <script>
        document.getElementById('error-panel-clear').addEventListener('click', () => {
            document.getElementById('error-log').innerHTML = '';
            document.getElementById('error-panel').style.display = 'none';
        });
    </script>

    <!-- Main split layout: simulation panel | resize handle | program panel -->
    <div id="main-split">

        <!-- Simulation panel (left, ~60%) -->
        <div id="appbody">
            <!-- canvas injected by main.js -->
            <div id="viewport-overlays">
                <button id="plot-toggle-button" class="overlay-button" title="Toggle live joint plot">📈 Plot</button>
            </div>
            <div id="sim-footer">
                <button id="pause-button" class="sim-control" title="Pause/Play (Space)" aria-label="Pause or play simulation">⏸</button>
                <button id="reset-button" class="sim-control" title="Reset robot (R)" aria-label="Reset robot">↺</button>
            </div>
            <script type="module" src="./examples/main.js?v=19"></script>
        </div>

        <!-- Vertical divider -->
        <div id="split-handle" title="Drag to resize"></div>

        <!-- Program panel (right, ~40%) -->
        <div id="python-ide">
            <div id="editor-mode-bar" class="editor-mode-bar">
                <div class="mode-toggle-group" role="tablist" aria-label="Editor view mode">
                    <button type="button" id="mode-btn-python" class="mode-btn active" role="tab" aria-selected="true" title="Python Code Editor">Python</button>
                    <button type="button" id="mode-btn-blocks" class="mode-btn" role="tab" aria-selected="false" title="Blockly Visual Editor">Blocks</button>
                </div>
            </div>

            <div id="python-editor-container">
                <div id="blockly-editor-container" style="display:none"></div>
                <div id="python-code-editor"></div>
                <textarea id="python-code" style="display:none"></textarea>
            </div>

            <div class="console-section">
                <div class="console-header">
                    <span class="console-title">Console</span>
                    <button id="clear-python" class="console-clear">Clear</button>
                </div>
                <div id="python-output">
                    <div class="output-label">OUTPUT</div>
                </div>
            </div>

            <div class="ide-footer">
                <button id="save-python" class="ide-button save" title="Download script as .py">⬇ Save</button>
                <button id="run-python" class="ide-button run" title="Run script (Ctrl+Enter)">▶ Run</button>
                <button id="stop-python" class="ide-button stop" title="Stop running script (Esc)" style="display:none">⏹ Stop</button>
            </div>
        </div>
    </div>

    <!-- Vertical-divider drag wiring -->
    <script>
        (function () {
            const STORAGE_KEY = 'robospace_split_ratio';
            const MIN_RATIO = 0.30;
            const MAX_RATIO = 0.80;
            const DEFAULT_RATIO = 0.60;

            const split  = document.getElementById('main-split');
            const left   = document.getElementById('appbody');
            const handle = document.getElementById('split-handle');

            const saved = parseFloat(localStorage.getItem(STORAGE_KEY));
            const initRatio = (!isNaN(saved) && saved >= MIN_RATIO && saved <= MAX_RATIO) ? saved : DEFAULT_RATIO;
            left.style.flexBasis = (initRatio * 100) + '%';

            let dragging = false;

            handle.addEventListener('pointerdown', (e) => {
                if (window.matchMedia('(max-width: 640px)').matches) return; // disable drag on stacked mobile
                dragging = true;
                handle.setPointerCapture(e.pointerId);
                document.body.style.cursor = 'ew-resize';
                e.preventDefault();
            });

            handle.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                const rect = split.getBoundingClientRect();
                const ratio = Math.min(MAX_RATIO, Math.max(MIN_RATIO, (e.clientX - rect.left) / rect.width));
                left.style.flexBasis = (ratio * 100) + '%';
                if (window._roboDemo) window._roboDemo.onWindowResize();
                if (window._blockEditor) window._blockEditor.resize();
            });

            handle.addEventListener('pointerup', (e) => {
                if (!dragging) return;
                dragging = false;
                document.body.style.cursor = '';
                const rect = split.getBoundingClientRect();
                const finalRatio = (left.getBoundingClientRect().width) / rect.width;
                localStorage.setItem(STORAGE_KEY, finalRatio.toFixed(4));
                handle.releasePointerCapture(e.pointerId);
                if (window._blockEditor) window._blockEditor.resize();
            });

            window.addEventListener('resize', () => {
                if (window._blockEditor) window._blockEditor.resize();
            });
        })();
    </script>
</body>

</html>
