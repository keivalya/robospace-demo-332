<!DOCTYPE html>
<html lang="en">

<head>
    <title>RoboSpace Demo</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="application-name" content="robospace_demo">
    <meta name="description" content="RoboSpace Demo">
    <meta name="keywords" content="RoboSpace">
    <meta name="author" content="keivalya">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no, shrink-to-fit=0">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" type="image/x-icon" href="./examples/favicon.png">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.23.4/full/pyodide.js"></script>
    <!-- <script src="./dist/mujoco_wasm.js"></script> -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <h1 hidden></h1>

    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
            { "imports": { "three": "https://unpkg.com/three@0.150.1/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/" } }
        </script>

    <!-- Toolbar -->
    <div id="toolbar">
        <div class="toolbar-brand">RoboSpace</div>

        <button id="toolbar-menu-toggle" class="toolbar-menu-btn" aria-label="Toggle menu" aria-expanded="false">
            <span></span><span></span><span></span>
        </button>

        <div id="toolbar-collapsible">
            <div class="toolbar-section">
                <label class="toolbar-label">Scene</label>
                <select id="scene-selector" class="toolbar-select"></select>
            </div>

            <div class="toolbar-section">
                <button id="pause-button" class="toolbar-button" title="Pause/Play">⏸</button>
                <button id="reset-button" class="toolbar-button" title="Reset Robot">↺ Robot</button>
                <button id="reload-button" class="toolbar-button" title="Reload Environment">↺ Env</button>
                <button id="connect-robot-button" class="toolbar-button" title="Connect to physical robot">🔌 Connect</button>
                <span id="connection-status" class="toolbar-value">Disconnected</span>
            </div>

            <div class="toolbar-section">
                <label class="toolbar-label">Noise Rate</label>
                <div class="toolbar-slider-container">
                    <input type="range" id="noise-rate-slider" class="toolbar-slider" min="0" max="2" step="0.01"
                        value="0.1">
                    <span id="noise-rate-value" class="toolbar-value">0.10</span>
                </div>
            </div>

            <div class="toolbar-section">
                <label class="toolbar-label">Noise Scale</label>
                <div class="toolbar-slider-container">
                    <input type="range" id="noise-scale-slider" class="toolbar-slider" min="0" max="2" step="0.01"
                        value="0">
                    <span id="noise-scale-value" class="toolbar-value">0.00</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('toolbar-menu-toggle').addEventListener('click', function () {
            const col = document.getElementById('toolbar-collapsible');
            const expanded = col.classList.toggle('open');
            this.setAttribute('aria-expanded', expanded);
        });
    </script>

    <!-- Main 3D View -->
    <div id="appbody">
        <div id="error"></div>
        <script type="module" src="./examples/main.js"></script>
    </div>

    <!-- Python IDE -->
    <div id="python-ide">
        <div class="ide-header">
            <div class="ide-title">
                <span>Simulation Controller</span>
            </div>
            <div class="ide-controls">
                <button id="run-python" class="ide-button">▶ RUN</button>
                <button id="clear-python" class="ide-button clear">✕</button>
                <button id="toggle-ide" class="ide-button toggle">⌄</button>
            </div>
        </div>
        <div id="python-editor-container">
            <textarea id="python-code" placeholder="# Enter Python code here to control the robot"></textarea>
            <div id="python-output">
                <div class="output-label">OUTPUT</div>
            </div>
        </div>
    </div>
</body>

</html>
